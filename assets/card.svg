<svg width="850" height="50" viewBox="0 0 850 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes runAcross {
        0% {
          transform: translateX(20px);
        }
        50% {
          transform: translateX(780px);
        }
        100% {
          transform: translateX(20px);
        }
      }
      .cat-mover {
        animation: runAcross 10s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Đường kẻ line ngang phân cách mờ -->
  <line x1="20" y1="42" x2="830" y2="42" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Con mèo chạy qua lại -->
  <g class="cat-mover">
    
  </g>
</svg>
