<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Đường ray hình chữ nhật bo góc để mèo chạy theo vòng tròn -->
    <path id="track" d="M 40,20 H 740 A 20,20 0 0 1 760,40 V 140 A 20,20 0 0 1 740,160 H 40 A 20,20 0 0 1 20,140 V 40 A 20,20 0 0 1 40,20 Z" />
  </defs>

  <!-- Viền nét đứt của đường ray quanh ô (tùy chọn hiển thị) -->
  <use href="#track" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Chữ hiển thị ở tâm của ô -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="16" fill="#94a3b8">
    🐾 Catch me if you can! 🐾
  </text>

  <!-- Chú mèo di chuyển tuần hoàn dọc theo đường ray 4 cạnh -->
  <g>
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track" />
    </animateMotion>
    
    <!-- Nhúng ảnh con mèo vào đây (dùng Data URI Base64 hoặc link raw github) -->
    
  </g>
</svg>
