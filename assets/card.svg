

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536"
     height="1024"
     viewBox="0 0 1536 1024">

    <title>Le Van Hiep - AI Engineer</title>

    <!-- Background image -->
    <image
        x="0"
        y="0"
        width="1536"
        height="1024"
        xlink:href="ai-background.png"
        preserveAspectRatio="xMidYMid slice"
    />

    <!-- Dark overlay -->
    <defs>
        <linearGradient id="overlay">
            <stop offset="0%" stop-color="#020817" stop-opacity="0.1"/>
            <stop offset="50%" stop-color="#020817" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#020817" stop-opacity="0.1"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="4"
                            result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="1536"
          height="1024"
          fill="url(#overlay)"/>

    <!-- Name -->
    <text x="768"
          y="480"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="90"
          font-weight="bold"
          letter-spacing="8"
          fill="#FFFFFF">
        LÊ VĂN HIỆP
    </text>

    <!-- Neon divider -->
    <line x1="420"
          y1="525"
          x2="1116"
          y2="525"
          stroke="#00CFFF"
          stroke-width="3"
          filter="url(#glow)"/>

    <!-- Main title -->
    <text x="768"
          y="610"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="40"
          font-weight="bold"
          letter-spacing="7"
          fill="#65E5FF">
        AI ENGINEER
    </text>

    <!-- Subtitle -->
    <text x="768"
          y="675"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="30"
          letter-spacing="5"
          fill="#FFFFFF">
        MACHINE LEARNING
    </text>

</svg>
